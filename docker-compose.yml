name: buzz

services:
  postgres:
    image: postgres:17-alpine
    container_name: buzz-postgres
    environment:
      POSTGRES_USER: buzz
      POSTGRES_PASSWORD: buzz_dev
      POSTGRES_DB: buzz
      PGDATA: /var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - buzz-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buzz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512m
    labels:
      com.buzz.service: "postgres"
      com.buzz.env: "dev"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: buzz-redis
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - buzz-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 128m
    labels:
      com.buzz.service: "redis"
      com.buzz.env: "dev"
    restart: unless-stopped

  adminer:
    image: adminer:latest
    container_name: buzz-adminer
    ports:
      - "127.0.0.1:8082:8080"
    networks:
      - buzz-net
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    deploy:
      resources:
        limits:
          memory: 64m
    labels:
      com.buzz.service: "adminer"
      com.buzz.env: "dev"
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: buzz-keycloak
    command: start-dev --http-port=8080
    environment:
      KC_DB: dev-mem
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "127.0.0.1:8180:8080"
    networks:
      - buzz-net
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m
    labels:
      com.buzz.service: "keycloak"
      com.buzz.env: "dev"
    restart: unless-stopped

  # S3-compatible object storage for media and git objects. RustFS replaced
  # MinIO in 2026-10: MinIO's repository is archived and its images can no
  # longer be pulled.
  rustfs:
    image: rustfs/rustfs:1.0.1
    container_name: buzz-rustfs
    environment:
      RUSTFS_ACCESS_KEY: buzz_dev
      RUSTFS_SECRET_KEY: buzz_dev_secret
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - rustfs-data:/data
    networks:
      - buzz-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512m
    labels:
      com.buzz.service: "rustfs"
      com.buzz.env: "dev"
    restart: unless-stopped

  rustfs-init:
    # MinIO's own mc images can no longer be pulled; pgsty/mc is a maintained
    # build of the same client.
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    container_name: buzz-rustfs-init
    depends_on:
      rustfs:
        condition: service_healthy
    networks:
      - buzz-net
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://rustfs:9000 buzz_dev buzz_dev_secret &&
        mc mb --ignore-existing local/buzz-media &&
        mc anonymous set none local/buzz-media
      "
    labels:
      com.buzz.service: "rustfs-init"
      com.buzz.env: "dev"
    restart: "no"

  # A long-lived mc client sharing RustFS's network namespace, so
  # `docker exec buzz-mc mc ...` reaches it at localhost:9000. The live
  # versioned-bucket tests in crates/buzz-media drive bucket setup through it;
  # the RustFS image ships no mc of its own.
  mc:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    container_name: buzz-mc
    network_mode: "service:rustfs"
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c", "sleep infinity"]
    labels:
      com.buzz.service: "mc"
      com.buzz.env: "dev"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: buzz-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - buzz-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 128m
    labels:
      com.buzz.service: "prometheus"
      com.buzz.env: "dev"
    restart: unless-stopped

volumes:
  postgres-data:
    name: buzz-postgres-data
    labels:
      com.buzz.volume: "postgres"
  rustfs-data:
    name: buzz-rustfs-data
    labels:
      com.buzz.volume: "rustfs"
  prometheus-data:
    name: buzz-prometheus-data
    labels:
      com.buzz.volume: "prometheus"

networks:
  buzz-net:
    name: buzz-net
    driver: bridge
    labels:
      com.buzz.network: "dev"
