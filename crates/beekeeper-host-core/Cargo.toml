[package]
name = "beekeeper-host-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared contract between a coding-session provider's launcher and the Beekeeper desktop app: identity records, the child environment, binary discovery and the host state-dir layout."

