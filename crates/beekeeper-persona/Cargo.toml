[package]
name = "beekeeper-persona"
version = "0.1.0"
edition = "2021"
description = "Parser and loader for Beekeeper persona pack files (.persona.md)"
license = "Apache-2.0"
repository.workspace = true

[dependencies]
chrono = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = { workspace = true }
semver = "1"
serde_yaml = "0.9"
sha2 = { workspace = true }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
