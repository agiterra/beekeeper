cause = "The author published a later record naming this one in supersedes, with the same subject, author, type and verdict subtype. A correction that changes any of those is refused as invalid_correction and this record stands."
command = "bee --format json sessions operation list --channel <uuid> --session-ref <uuid> --genesis <hex64>   # read .fold.excluded[].code"
frozen_source = ""
frozen = ""

