# Seeded ahead of the enum variant it names, so that the lane adding
# `CompletionNotVerified` to the fold finds the word already written and the
# guard already green. `explain completion_not_verified` answers today; the
# code only reaches a fold once that lane lands.
[[entry]]
word = "completion_not_verified"
aliases = ["CompletionNotVerified"]
meaning = "A mission.completed was excluded because the session's policy requires a verifier's ruling and no active verifier has ruled on the approved report."
cause = "The policy sets gates.verifierRequired, the assignment settled on a report, and no seat holding an active verifier seat has ruled on that report. It is a different fact from completion_not_approved: the chain is closed, the independent ruling is missing."
command = "bee --format json sessions operation list --channel <uuid> --session-ref <uuid> --genesis <hex64>   # read .fold.excluded[].reason"
frozen_source = "batch vocabulary, verified completion"
frozen = "mission.completed requires a verifier's ruling while the policy sets gates.verifierRequired: assignment <assignmentId> settled on report <reportId>, and no active verifier seat has ruled on that report"

# Lane L21 (2026-09-03). `bee git check --ref` prints "admitted by arm (A)"
# and "admitted by arm (C)", and the relay's refusals name what an arm fell
# short of, so the word needs a definition a seat can read from the binary.
[[entry]]
word = "arm"
aliases = ["arms", "arm_a", "arm_b", "arm_c", "gate-row route", "gate_row_route", "require-verdict", "require_verdict"]
meaning = "One of the three ways a require-verdict ref admits a push. (A) The pusher is a founder of the repository, needing no verdict at all. (B) Every required gate — the policy's gates.requiredGates, by default cargo fmt, cargo clippy and cargo test — has a provider-observed green kind-44246 row that names the pushed commit in headSha over a clean worktree (dirty false), published by the mission's own provider while the pusher holds an active seat of that mission, and the policy does not set gates.verifierRequired. (C) A lead's approving disposition names the pushed commit through the governed report's typed headSha and branch, and an active verifier seat that is not the report's own author published a not-refuted refutation of that report; since 2026-09-03 arm C also needs arm B's rows on the commit."
cause = "Humans never gate a landing (Brian, 2026-09-03 and 2026-09-04): the rule replaces review with proof, so a founder pushes freely and everybody else needs machine-checkable evidence. Proof scales to risk: arm B lands small missions with no second seat, because kind 44246 gate rows have carried headSha and dirty since 2026-09-03 and the relay reads them (coding_session_verdict_admission_observed.rs); arm C is demanded only when the policy asks for a verifier, and then it needs the rows too. Before 2026-09-03 the row named no commit and arm B could not be built; this entry kept saying so until finding 74 (live run 6, 2026-09-04) caught a lead believing it over the relay's own refusal, whose text names exactly which gate, commit or worktree state is missing."
command = "bee git check --ref refs/heads/main   # read .prediction.arm"
frozen_source = ""
frozen = ""

# Finding 33 (2026-09-03). The word appears in the relay's own refusal copy
# ("reserves a gated ref to a founder of this repository"), in `bee repos get`,
# and on the desktop's Land control, and until this entry nothing defined it.
# The batch specification freezes no sentence about the word itself, so
# `frozen` is empty rather than invented.
[[entry]]
word = "founder"
aliases = ["founders", "founder_pubkey", "founderPubkey", "repo_founders", "maintainers"]
meaning = "A key that speaks for a repository: the kind:30617 announcement's signer, every pubkey in its NIP-34 maintainers tag, and every Owner on the project roster its project back-reference names."
cause = "The require-verdict gate admits a founder's push outright, with no verdict read at all (arm A), and searches only missions whose founder is one of these keys when judging anybody else's (arm C). Rules are narrower: only the announcement's signer can rewrite a buzz-protect tag in v1, so a co-founder who edits rules creates their own repository instead of editing yours."
command = "bee repos get --id <repo-id> --owner <hex64>   # read .founders and .founders_note"
frozen_source = ""
frozen = ""

# Lane L23 (2026-09-03). Brian's direction: "I should be able to log into
# beekeeper from any machine and have my agents and their packs. If a role
# evolves it should change on Andy's machine and any other team member's."
# The word now appears on a seat's own 44223 (`packRef`), in `bee packs
# status`, and on the seat chip, so it needs a definition a seat can read from
# the binary. The batch specification freezes no sentence about it, so `frozen`
# is empty rather than invented.
[[entry]]
word = "pack"
aliases = ["packs", "packRef", "pack_ref", "packSource", "pack_source", "30624"]
meaning = "The persona files a seat was actually staged from: a directory of role text inside a git repository, named on the wire by a kind:30624 project pack source and, once staged, by the seat's own packRef (repo, resolved sha, role, path)."
cause = "The seat's role picks the pack, never the actor's home role. Three rungs, in order: the packs repository the project's kind:30624 names, the session checkout's own personas/roles/<role>/ overlaid on it, and the app's shipped defaults (packRef repo 'app:shipped', sha = the app version). No packRef at all means no pack staged — read that absence as absence, never as a default. A pack that cannot be fetched refuses the hire; it never becomes a silent bare persona."
command = "bee packs status --project 30621:<owner-hex>:<slug> --role <slug>   # read .source_kind and .would_stage"
frozen_source = ""
frozen = ""
