# The team-fold vocabulary, as data.
#
# Every word this repository's typed team fold puts in front of a seat is
# defined here, and `include_str!`-ed into `buzz-core` at compile time
# (`crates/beekeeper-core/src/team_vocabulary.rs`). The binary therefore carries the
# words with or without a checkout: `bee sessions explain <word>` answers from
# this file, not from a source tree the reader may not have.
#
# Why it exists: on 2026-09-01 a lead (Keystone) spent its own context grepping
# the fold's Rust source for the string "unseated", because that was the only
# place the word its own tool had just printed was defined. A seat that must
# read `crates/` to use `bee` is spending turns on our filing system.
#
# SHAPE. A strict subset of TOML — an array of `[[entry]]` tables whose values
# are basic strings or arrays of basic strings. `team_vocabulary.rs` parses
# exactly that subset and refuses anything else, so a file that drifts outside
# it fails `cargo test -p beekeeper-core` rather than half-loading.
#
# FIELDS.
#   word           the canonical word, as a reader meets it
#   aliases        other spellings that resolve to this entry (wire codes,
#                  the Rust Debug spelling, the camelCase JSON key)
#   meaning        one sentence: what the word means
#   cause          what makes it appear
#   command        the one command that shows it
#   frozen_source  where a frozen sentence about this word is written, or ""
#   frozen         that sentence, byte-for-byte, or ""
#
# THE FROZEN FIELDS ARE NOT PROSE. Every non-empty `frozen` value is copied
# from the batch specification's frozen vocabulary and is compared, byte for
# byte, against `team-fold.quotes.txt` beside this file. Editing one without
# the other fails the snapshot test. Where the specification freezes no
# sentence about a word, `frozen` is empty and `explain` says so: this file
# never invents a rule to fill the gap.

[[entry]]
word = "unseated"
aliases = ["unseated_reports", "unseatedReports", "unseated_report"]
meaning = "A report the fold counted is signed by someone holding no active seat for the role its assignment names."
cause = "The host seated the agent and the accepted kind:44228 authority chain never learned about it — usually a create whose provider receipt landed after the hire's window closed. The report is canonical either way; only the seat is missing."
command = "bee --format json sessions operation list --channel <uuid> --session-ref <uuid> --genesis <hex64>   # read .fold.unseatedReports"
frozen_source = "batch vocabulary, fold disclosure"
frozen = "reports **included** by assignee-equality whose author holds no active seat for the assignment's `assignee_role`."

[[entry]]
word = "waiting"
aliases = ["waiting_on_decision", "waitingOnDecision", "waiting-on-decision"]
meaning = "The mission has asked a named party for a ruling and nobody has answered it."
cause = "The oldest canonical decision.request with no answer on the wire, whatever its blocks names. Which assignments the question holds up is a separate fact, carried on the decision's own blocks."
command = "bee --format json sessions operation list --channel <uuid> --session-ref <uuid> --genesis <hex64>   # read .fold.waitingOnDecision"
frozen_source = "batch vocabulary, waiting and decisions"
frozen = "Rail: `Waiting on the founder`, or `Waiting on {Who}` for an actor-held request."

[[entry]]
word = "dangling"
aliases = ["dangling_reference", "DanglingReference"]
meaning = "One record points at an event that is not in the set the fold was given, so that record alone cannot be placed."
cause = "A causal or supersedes reference naming an absent event — a report citing an assignment nobody published, most often. It excludes that one record and nothing else: before this code existed, one malformed pointer denied every seat in the session its governance state."
command = "bee --format json sessions operation list --channel <uuid> --session-ref <uuid> --genesis <hex64>   # read .fold.excluded[].code"
frozen_source = ""
frozen = ""

