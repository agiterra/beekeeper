[package]
name = "beekeeper-acp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "ACP harness that bridges Buzz events to AI agents"

[lib]
name = "beekeeper_acp"
path = "src/lib.rs"

[[bin]]
name = "buzz-acp"
path = "src/main.rs"

[dependencies]
# Internal
beekeeper-core = { workspace = true }
beekeeper-sdk = { workspace = true }
beekeeper-persona = { path = "../beekeeper-persona" }

# Nostr
nostr = { workspace = true }

# Async runtime
tokio = { workspace = true }

# WebSocket
tokio-tungstenite = { workspace = true }

# Codec (bounded line reads)
tokio-util = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
futures-util = { workspace = true }

# HTTP (channel discovery REST API)
reqwest = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# IDs
uuid = { workspace = true }
chrono = { workspace = true }

# URL parsing
url = { workspace = true }

# NIP-98 HTTP auth signing
sha2 = { workspace = true }
base64 = "0.22"
hex = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Config file
toml = "1.0"

# Filter expressions
evalexpr = { workspace = true }

# Process-group kill (safe wrapper around killpg) — Unix-only; kill_process_group
# has a #[cfg(not(unix))] fallback in acp.rs.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["signal"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3"
httparse = "1"
# The base prompt's `bee` command table is checked against the CLI's clap tree
# (tests/base_prompt_command_table.rs). Test-only: buzz-acp never calls bee.
beekeeper-cli = { path = "../beekeeper-cli" }
