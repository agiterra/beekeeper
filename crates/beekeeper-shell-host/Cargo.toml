[package]
name = "beekeeper-shell-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Detached PTY host for Beekeeper built-in shell sessions (dtach-style)"

[lib]
name = "beekeeper_shell_host"
path = "src/lib.rs"

[[bin]]
name = "beekeeper-shell-host"
path = "src/main.rs"

[dependencies]
# PTY allocation + shell spawn (same version the desktop app uses).
portable-pty = "0.9"

# CLI args for the host process.
clap = { version = "4", features = ["derive"] }

# Receipt/meta JSON + the Hello control frame payload.
serde = { workspace = true }
serde_json = { workspace = true }

# setsid()/SIGHUP-ignore for detachment; pid-liveness checks.
libc = "0.2"

# Stable session ids echoed back in receipts.
uuid = { workspace = true }
