[package]
name = "beekeeper-admin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Operator CLI for Buzz relay administration"

[[bin]]
name = "buzz-admin"
path = "src/main.rs"

[dependencies]
beekeeper-db = { workspace = true }
beekeeper-deletion = { workspace = true }
beekeeper-core = { workspace = true }
beekeeper-auth = { workspace = true }
beekeeper-pubsub = { workspace = true }
beekeeper-search = { workspace = true }
beekeeper-audit = { workspace = true }
beekeeper-workflow = { workspace = true }
beekeeper-media = { workspace = true }
nostr = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
hex = { workspace = true }
deadpool-redis = { workspace = true }
# Redis TLS (rediss://, e.g. ElastiCache) uses rustls, which needs a process
# CryptoProvider installed at startup. The workspace redis TLS feature compiles
# both aws-lc-rs and ring in transitively, so rustls can't auto-select one — we
# install ring explicitly in main(). Mirrors buzz-relay's setup.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tracing = { workspace = true }
sqlx = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
clap = { version = "4", features = ["derive"] }
