[package]
name = "beekeeper-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Named for the role the code already had: `session_provider/mod.rs` opened
# with "Desktop host for the first-party coding-session provider" and `env.rs`
# called the env map "the real interface between host and provider". This is
# that host, with the desktop taken out of it.
#
# Not to be confused with `buzz-shell-host`, which hosts one PTY for one
# built-in shell session. This hosts the machine's Beekeeper background
# services: it owns the coding-session provider and answers a local control
# socket about it.
description = "Headless host for Beekeeper's background agents: supervises the coding-session provider and answers a local control socket."

[[bin]]
name = "beekeeper-host"
path = "src/main.rs"

[lib]
name = "beekeeper_host"
path = "src/lib.rs"

[dependencies]
buzz-core = { path = "../buzz-core" }
beekeeper-host-core = { path = "../beekeeper-host-core" }
chrono = { workspace = true }
clap = { version = "4", features = ["derive"] }
dirs = "6"
nostr = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Unix-only, and the crate says so at its entry point rather than failing to
# compile: the control socket is an `AF_UNIX` socket and the login
# registrations are launchd and systemd. A Windows host needs named pipes and a
# different service manager, which is separate work — the same shape
# `buzz-shell-host` already has.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["signal", "process", "socket", "user"] }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }

[[example]]
name = "mint-test-identity"
path = "examples/mint-test-identity.rs"
