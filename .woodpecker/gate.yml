# Gate: unit-level checks on every push to `main` and every PR.
# Service credentials mirror the repo's dev docker-compose.yml (buzz/buzz_dev),
# reached by service hostname instead of localhost. Heavy DB-only (`--ignored`)
# suites and browser e2e live in nightly.yml.
#
# Steps run on the prebaked `buzz-ci` image (apt deps only — see
# scripts/ci-image/Dockerfile) with host cache mounts under /srv/ci-cache,
# so warm runs skip apt, toolchain installs, registry downloads, and dependency
# compilation. Cache layout + image rebuild runbook: docs/INTEGRATION.md.
when:
  - event: push
    branch: main
  - event: pull_request

# Pin the workspace path so host cache mounts can target workspace-relative
# hermit paths: hermit's rustup package hard-pins CARGO_HOME to
# ${HERMIT_ENV}/.hermit/rust at shim-exec time (ambient env overrides do not
# stick), so the registry cache must be mounted exactly there.
workspace:
  base: /woodpecker
  path: repo

# The default partial/blobless clone lazily fetches objects on demand, which
# fails in command steps (no credentials there) — keep partial off. depth: 1
# because the gate uses no git history: the file-size ratchet does not run
# here (desktop `pnpm check` is biome + px-text + pubkey-truncation only). It
# runs on pre-push instead, where it resolves its base from `origin/main`
# directly. If it is ever added to the gate, raise the depth so that merge-base
# is reachable.
clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      partial: false
      depth: 1

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: buzz
      POSTGRES_USER: buzz
      POSTGRES_PASSWORD: buzz_dev
  redis:
    image: redis:7-alpine
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    # entrypoint form — the commands: wrapper exits 127 on this image
    entrypoint: ["/usr/bin/docker-entrypoint.sh", "minio", "server", "/data"]
    environment:
      MINIO_ROOT_USER: buzz_dev
      MINIO_ROOT_PASSWORD: buzz_dev_secret

steps:
  rust:
    image: buzz-ci:1
    # Explicit empty depends_on puts the pipeline in DAG mode: rust and
    # desktop start together; rust-agent waits for both (see below).
    depends_on: []
    # Cache mounts require the repo's Trusted→Volumes flag in Woodpecker.
    volumes:
      # CARGO_HOME (registry, git checkouts, cargo/rustup bins) — hermit pins
      # it inside the workspace, hence the workspace-relative mount point.
      - /srv/ci-cache/hermit-rust:/woodpecker/repo/.hermit/rust
      # RUSTUP_HOME default — installed toolchains persist here.
      - /srv/ci-cache/rustup:/root/.rustup
      # Hermit package downloads + unpacked packages.
      - /srv/ci-cache/hermit:/root/.cache/hermit
      - /srv/ci-cache/hermit-state:/root/.local/state/hermit
      # Persistent target dir shared across runs (and with nightly). Cargo's
      # build lock serializes the rare concurrent pipeline safely.
      - /srv/ci-cache/cargo-target:/ci-target
    environment:
      # Hermit only pins CARGO_HOME; these pass through to cargo untouched.
      CARGO_TARGET_DIR: /ci-target
      # Fresh-clone mtimes defeat incremental compilation anyway, and it
      # roughly triples target-dir disk — off in CI.
      CARGO_INCREMENTAL: "0"
      BUZZ_TEST_DATABASE_URL: postgres://buzz:buzz_dev@postgres:5432/buzz
      BUZZ_TEST_POSTGRES_PASSWORD: buzz_dev
      DATABASE_URL: postgres://buzz:buzz_dev@postgres:5432/buzz
      REDIS_URL: redis://redis:6379
      BUZZ_S3_ENDPOINT: http://minio:9000
      BUZZ_S3_ACCESS_KEY: buzz_dev
      BUZZ_S3_SECRET_KEY: buzz_dev_secret
    commands:
      # The repo pins its toolchain via hermit shims in bin/
      - export PATH="$CI_WORKSPACE/bin:$PATH"
      # The relay's release image builds with `--locked`, but `cargo test` does
      # not, so a Cargo.lock that has drifted from the manifests passes this
      # gate and then fails the deploy build. That is exactly how the stale
      # buzz-shell-host closure reached `integrated` on 2026-08-18 and blocked
      # the relay from shipping. Seconds, and it fails before anything costly.
      - cargo metadata --locked --format-version 1 > /dev/null
      # The DB-backed relay/db unit tests need the migrated schema, not just a
      # reachable postgres (upstream CI has the same apply-schema step).
      - cargo run -p buzz-admin -- migrate
      # mesh_demo runs for real here (redis present; it self-skips without) but
      # its loopback-QUIC echo cannot complete inside this docker-in-incus
      # runner (10s ECHO_TIMEOUT expires consistently, isolated or not).
      # Known runner-env limitation — see docs/INTEGRATION.md. The echo test
      # is excluded; the rest of mesh_demo still runs isolated below.
      - cargo test --workspace --exclude buzz-agent -- --skip api::mesh_demo
      - cargo test -p buzz-relay --lib api::mesh_demo -- --skip demo_join_forwarded_arm_round_trips_echo

  desktop:
    image: buzz-ci:1
    depends_on: []
    volumes:
      - /srv/ci-cache/hermit:/root/.cache/hermit
      - /srv/ci-cache/hermit-state:/root/.local/state/hermit
      # pnpm keeps its store on the project's filesystem (the workspace
      # volume), NOT under $HOME — the old /root/.local/share/pnpm/store
      # mount stayed empty forever. /woodpecker is the workspace disk root.
      - /srv/ci-cache/pnpm-store:/woodpecker/.pnpm-store
    commands:
      # The clone step runs as a different uid than this container's root.
      - git config --global --add safe.directory "$CI_WORKSPACE"
      - export PATH="$CI_WORKSPACE/bin:$PATH"
      # pnpm's store→node_modules copyfile occasionally hits a transient EAGAIN
      # on this docker-in-incus filesystem; install up front with one retry so
      # the implicit install inside `pnpm check` never has to do the heavy copy.
      - (cd desktop && pnpm install) || (sleep 15 && cd desktop && pnpm install)
      - just desktop-check
      - just desktop-test
      # The banked donor corpora, re-derived against this repo's own
      # implementation. Absorption's rule is that a corpus is only a guarantee
      # once something re-runs it — until now nothing did, so a green build said
      # nothing about whether the donor laws still held. Both are plain
      # `node --test` over node builtins: no install, no services, seconds.
      - just conformance-check
      - just export-viewer-manifest-test
      # Keep last: this `cd` persists for the rest of the step.
      - cd desktop && pnpm typecheck

  deploy-scripts:
    image: buzz-ci:1
    # Bash only — no toolchain, no cache mounts, seconds to run. Kept separate
    # from `rust` so it stays green even where the Trusted→Volumes flag is not
    # set, and so a deployer regression is legible on its own row.
    depends_on: []
    commands:
      - git config --global --add safe.directory "$CI_WORKSPACE"
      - ./deploy/autodeploy/tests/config-contract.sh
      - ./deploy/autodeploy/tests/autodeploy-behavior.sh

  rust-agent:
    image: buzz-ci:1
    # buzz-agent's regressions harness is CPU-load sensitive (5s canned-LLM
    # timeouts): running strictly after everything else guarantees free cores
    # (previously "last command in the rust step" — now enforced by the DAG).
    depends_on: [rust, desktop, deploy-scripts]
    volumes:
      - /srv/ci-cache/hermit-rust:/woodpecker/repo/.hermit/rust
      - /srv/ci-cache/rustup:/root/.rustup
      - /srv/ci-cache/hermit:/root/.cache/hermit
      - /srv/ci-cache/hermit-state:/root/.local/state/hermit
      - /srv/ci-cache/cargo-target:/ci-target
    environment:
      # Same env as the rust step — buzz-agent previously ran inside it.
      CARGO_TARGET_DIR: /ci-target
      CARGO_INCREMENTAL: "0"
      BUZZ_TEST_DATABASE_URL: postgres://buzz:buzz_dev@postgres:5432/buzz
      BUZZ_TEST_POSTGRES_PASSWORD: buzz_dev
      DATABASE_URL: postgres://buzz:buzz_dev@postgres:5432/buzz
      REDIS_URL: redis://redis:6379
      BUZZ_S3_ENDPOINT: http://minio:9000
      BUZZ_S3_ACCESS_KEY: buzz_dev
      BUZZ_S3_SECRET_KEY: buzz_dev_secret
    commands:
      - export PATH="$CI_WORKSPACE/bin:$PATH"
      # Runs the whole suite: the fake_llm steer/cancel timing races were
      # test-design, not runner-environment, and are fixed (the fake provider
      # now holds the round under test until the client has acted — see
      # LlmGate in crates/buzz-agent/tests/fake_llm.rs). Retry once anyway —
      # a real regression still fails twice. The build phase is a freshness
      # no-op against the warm shared target dir.
      - cargo test -p buzz-agent || cargo test -p buzz-agent
