# Nightly curated WebKit suite on `main` (SV-37): the `smoke-webkit` project in
# desktop/playwright.config.ts — boot smoke plus the coding-session specs under
# Playwright's WebKit engine. A WebKit engine proxy, not WKWebView: it catches
# Chromium-only assumptions, it is not the webview the macOS app ships in.
#
# Its own workflow, not a step in nightly.yml, so it gets its own timeout
# budget beside the full Chromium suite. Mock-bridge specs only: it needs no
# Postgres or Redis. Requires a Woodpecker cron named "nightly" targeting
# branch `main` (the same cron nightly.yml uses).
when:
  - event: cron
    cron: nightly

workspace:
  base: /woodpecker
  path: repo

# Partial clone lazy-fetches without credentials — keep off. depth: 1 because
# nothing here uses git history (see gate.yml).
clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      partial: false
      depth: 1

steps:
  # The image tag must match the resolved @playwright/test (pnpm-lock.yaml) or
  # the bundled browsers do not match what the runner expects.
  desktop-e2e-webkit:
    image: mcr.microsoft.com/playwright:v1.60.0-noble
    volumes:
      - /srv/ci-cache/hermit:/root/.cache/hermit
      - /srv/ci-cache/hermit-state:/root/.local/state/hermit
      # See gate.yml: pnpm's store lives at the workspace disk root.
      - /srv/ci-cache/pnpm-store:/woodpecker/.pnpm-store
    commands:
      - export PATH="$CI_WORKSPACE/bin:$PATH"
      - cd desktop
      - pnpm install --frozen-lockfile
      - pnpm test:e2e:webkit
