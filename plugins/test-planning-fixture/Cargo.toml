[package]
name = "beekeeper-test-planning-fixture"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0"
publish = false
description = "Test only: a second, independently built provider of beekeeper.planning/1, registered and called exactly like the first-party one"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = { version = "0.63", default-features = false, features = ["macros", "realloc"] }
serde_json  = "1"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true
