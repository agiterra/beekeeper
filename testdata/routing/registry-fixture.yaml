# A pin of the shared model registry contract, for the router tests.
#
# This is NOT the product's registry. The product reads `team/model-registry.yaml`
# at the repo root, which is a shared artifact of Brian's ruling of 2026-08-30
# (review-2026-08-30/routing-spec.md). This file exists so the desktop router
# (desktop/src/features/coding-sessions/lib/codingSessionRouting.ts) and any
# other implementation of the same rules can be asserted against one input.
#
# Every score below is Brian's seed table, verbatim (spec §3, lines 18-28).
# Every `facts` entry names its source:
#   - multimodal: the lane brief of 2026-08-30 ("multimodal true for all Claude
#     rows and for codex 5.6/5.5/5.4 rows unless the catalog metadata says
#     otherwise"). The kind:44222 catalog carries no modality field at all —
#     CatalogModel is { id, contextWindow, family, vendor, deprecated }
#     (crates/buzz-core/src/coding_session_catalog.rs:99-126) — so the catalog
#     says nothing either way and the brief is what was used.
#   - contextWindow: recorded only for Spark, from spec line 7 ("an ultra-fast
#     128K text-only coding preview"). Nobody has stated one for the others, so
#     no key is written: an absent fact is "nobody said", never a default.
#   - tools: nobody has stated tool support for any target. The key is absent
#     everywhere, which makes the researcher class (requires: search) route to
#     nothing. That is the honest answer and it is recorded as such in
#     expected-decisions.json — it is a gap in the registry, not in the router.
#   - priceUsdPerM: spec-adjacent figures Brian gave for the three 5.6 rows
#     only. Recorded as a fact and deliberately NOT used for ranking: spec §1
#     forbids equating cost_efficiency with API $/MTok.
#   - quotaClass: which subscription lane the target spends (spec correction 3).
#   - knownFailureModes: empty everywhere — none recorded yet.
