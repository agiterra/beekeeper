# Glob patterns in `pre-commit` mirror the `changes` job's dorny/paths-filter
# groups in .github/workflows/ci.yml — keep the two in sync. Deliberate
# deviations:
# - The `.github/workflows/ci.yml` path CI adds to its `rust`/`mobile` filters
#   is omitted; a CI-workflow-only edit doesn't need a local test run.
# - Deletion-only surface changes do not trigger local `pre-commit` hooks:
#   lefthook 2.1.x drops deleted paths from file discovery (`extractFiles`
#   existence check, repository.go). CI's dorny/paths-filter catches deletions.
#   Deliberate — accepted, not worked around. `pre-push` is unaffected: the
#   floor reads `git diff --name-only` itself, so deletions are in its set.
# - `commit-msg` has no glob: it rewrites the commit message, not files. Note
#   Git only runs it for `git commit` and `git merge` — other flows need their own
#   flag: `git rebase --signoff`, `git cherry-pick -s`.
#
# `pre-push` carries no globs at all any more. It runs three unconditional
# guards and one scoped floor:
#
#   - `push-destination.sh` and `branch-skew` are guards, not tests. They are
#     unbudgeted and never skipped, and `push-destination.sh` stays a `script`
#     rather than a `command` because commands are file-filtered and a guard
#     that only runs when lefthook sees changed files is not a guard.
#   - `floor` derives its own scope from the merge-base diff
#     (`scripts/pre-push-floor.sh` + `scripts/pre-push-floor-scope.mjs`) and
#     prints one line saying what ran, what it skipped, why, and what it cost.
#     Path filtering lives there, in a tested pure function, rather than in
#     globs here — which is also why the repository-wide file-size ratchet is
#     still unfiltered: its own merge-base diff is its path filter.
#   - `floor` also checks for a pass stamp
#     (`scripts/pre-push-floor-stamp.mjs`) naming the current HEAD sha and the
#     exact changed-file set, and returns immediately when one is fresh and
#     matching, consuming it either way. Only `scripts/push-with-floor.sh`
#     (`just push`) writes that stamp, by running this same floor BEFORE `git
#     push` opens the connection — ledger 178(n): git mints its NIP-98
#     credential at ref discovery, before this hook runs, and reuses it for
#     the whole push, so a floor long enough to outlive the relay's +-900s
#     token window fails `HTTP 401` with every check green. A plain `git
#     push` never writes a stamp, so its own hook run here still runs the
#     floor in full, exactly as before.
#
# This block used to run `just test-unit` (`cargo test --workspace`) for any
# `crates/**` change plus the Tauri clippy+test pair on the same glob. That is
# a gate sized for a human with a coffee: on 2026-09-02 a seat pushing a
# one-line CLI fix hit its 60 s tool timeout on `git push`, and the answer that
# night was `--no-verify`. A gate everyone skips is not a gate. `cargo test
# --workspace`, every e2e project, `just ci` and `just check` are CI-only from
# here — see CONTRIBUTING.md § "What pre-push runs, and what it does not" for
# the failure class that trade moves to CI on purpose.
pre-commit:
  parallel: true
  commands:
    rust-fmt:
      glob: ["crates/**", "examples/countdown-bot/**"]
      run: just fmt
      stage_fixed: true
    desktop-tauri-fmt:
      glob: ["desktop/src-tauri/**"]
      run: just desktop-tauri-fmt
      stage_fixed: true
    desktop-fix:
      glob: ["desktop/**", "pnpm-lock.yaml"]
      exclude: ["desktop/src-tauri/**"]
      run: just desktop-fix
      stage_fixed: true
    web-fix:
      glob: ["web/**", "pnpm-lock.yaml"]
      run: just web-fix
      stage_fixed: true
    mobile-fix:
      glob: ["mobile/**"]
      run: just mobile-fix
      stage_fixed: true

# Appends the DCO Signed-off-by trailer the required "DCO Check" enforces.
# `--if-exists doNothing` makes it idempotent and preserves an existing
# sign-off (including `git commit -s` and a different signer's trailer).
commit-msg:
  commands:
    signoff:
      run: 'git interpret-trailers --if-exists doNothing --trailer "Signed-off-by: $(git var GIT_COMMITTER_IDENT | sed ''s/ [0-9]* [+-][0-9]*$//'')" --in-place {1}'

# Shares the commit that just happened under a wip ref, so Project Pulse can
# show what a person has committed locally without ever asking them to report
# it. Deliberately unfiltered: a post-commit hook has no staged file list to
# filter on, and the script is the same one the hire host installs for seats
# (`buzz_core::seat_git_hooks::WIP_POST_COMMIT_HOOK`).
#
# **Off by default.** The script exits immediately unless this checkout has
# `buzz.wipShare=true`, which only `just wip-share-on` sets — `just setup` and
# `just hooks` never do. Installing the hook is not opting in.
post-commit:
  commands:
    wip-share:
      run: ./scripts/wip-post-commit.sh

pre-push:
  parallel: true
  scripts:
    # Not a command: commands are file-filtered, and a guard that only runs
    # when lefthook sees changed files is not a guard.
    "push-destination.sh":
      runner: bash
  commands:
    branch-skew:
      run: ./scripts/check-branch-skew.sh
    floor:
      # Scoped to the merge-base diff, budget disclosed rather than enforced by
      # a kill. Runs fmt + unit tests for the crates that changed, clippy for
      # those plus their `cargo metadata`-derived dependents, the JS surface's
      # fast checks when that surface moved, and the file-size ratchet.
      run: ./scripts/pre-push-floor.sh
    current-state:
      # Hard ceiling on docs/CURRENT_STATE.md, lines and bytes. Milliseconds,
      # and unconditional: a guard that only runs when lefthook sees the file
      # in the push is not a guard.
      run: node scripts/check-current-state-size.mjs
