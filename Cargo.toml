[workspace]
members = [
    "crates/beekeeper-relay",
    "crates/beekeeper-core",
    "crates/beekeeper-conformance",
    "crates/beekeeper-push-gateway",
    "crates/beekeeper-db",
    "crates/beekeeper-pubsub",
    "crates/beekeeper-auth",
    "crates/beekeeper-search",
    "crates/beekeeper-audit",
    "crates/beekeeper-acp",
    "crates/beekeeper-agent",
    "crates/sprig",
    "crates/beekeeper-test-client",
    "crates/beekeeper-ws-client",
    "crates/beekeeper-admin",
    "crates/beekeeper-deletion",
    "crates/beekeeper-workflow",
    "crates/beekeeper-media",
    "crates/beekeeper-cli",
    "crates/beekeeper-pairing-cli",
    "crates/beekeeper-sdk",
    "crates/beekeeper-session-provider",
    "crates/beekeeper-host-core",
    "crates/beekeeper-host",
    "crates/beekeeper-persona",
    "crates/beekeeper-mirror-bridge",
    "crates/git-credential-nostr",
    "crates/git-sign-nostr",
    "crates/beekeeper-pair-relay",
    "crates/beekeeper-relay-mesh",
    "crates/beekeeper-dev-mcp",
    "crates/beekeeper-shell-host",
    "crates/beekeeper-voice",
    "crates/beekeeper-backend-kubernetes",
    "crates/beekeeper-datastore-tracing",
    "examples/countdown-bot",
]
exclude = ["desktop/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
# 1.89 is required for std file locking (File::try_lock), used by the
# coding-session provider's single-instance state-dir lock. The repo toolchain
# is pinned well above this (rust-toolchain.toml).
rust-version = "1.89.0"
license = "Apache-2.0"
repository = "https://github.com/agiterra/beekeeper"

[workspace.dependencies]
# Runtime
tokio       = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal", "process"] }
tokio-util  = { version = "0.7", features = ["rt", "codec"] }

# HTTP + WebSocket
axum        = { version = "0.8", features = ["ws", "macros"] }
tower       = { version = "0.5", features = ["timeout", "util", "limit"] }
tower-http  = { version = "0.6", features = ["trace", "cors", "compression-gzip", "limit", "timeout", "fs"] }

# Database
sqlx = { version = "0.9", features = [
    "runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json"
] }

# Redis
redis        = { version = "1.0", features = ["tokio-comp", "connection-manager", "tokio-rustls-comp"] }
deadpool-redis = { version = "0.23", features = ["rt_tokio_1"] }

# Kubernetes (beekeeper-backend-kubernetes provider). No `ring` feature here: the
# process-level CryptoProvider is installed explicitly at startup, matching
# buzz-cli/beekeeper-acp/beekeeper-admin/beekeeper-relay/beekeeper-dev-mcp — see the comment on the
# crate's own rustls dependency.
kube = { version = "2.0", default-features = false, features = ["client", "rustls-tls"] }
k8s-openapi = { version = "0.26", features = ["v1_31"] }

# Nostr
nostr = { version = "0.44", features = ["nip44", "nip98"] }

# Serialization
serde       = { version = "1", features = ["derive"] }
postcard    = { version = "1", default-features = false, features = ["use-std"] }

# Inter-relay mesh transport (buzz-relay-mesh)
iroh = { version = "1.0.0-rc.0", default-features = false, features = ["tls-ring"] }
serde_json  = "1"
serde_yaml  = "0.9"
evalexpr    = "11"
cron        = "0.16"
# Observability
tracing                     = "0.1"
tracing-subscriber          = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry       = { version = "0.33" }
opentelemetry               = { version = "0.32", features = ["trace"] }
opentelemetry_sdk           = { version = "0.32", features = ["trace", "rt-tokio"] }
opentelemetry-otlp          = { version = "0.32", default-features = false, features = ["trace", "grpc-tonic", "tls-ring"] }
metrics             = "0.24"
metrics-exporter-prometheus = "0.18"
metrics-util        = "0.20"

# Error handling
thiserror = "2"
anyhow    = "1"

# Utilities
uuid    = { version = "1", features = ["v4", "serde"] }
chrono  = { version = "0.4", features = ["serde"] }

# JWT / JWS verification (NIP-FI federated identity assertions)
jsonwebtoken = { version = "10.4.0", default-features = false, features = ["aws_lc_rs"] }

# HTTP client (webhook delivery)
reqwest = { version = "0.13", features = ["json", "rustls"], default-features = false }

# Regular expressions — the registry bench's `stdoutMatches` check
# (pure computation; already in the lock through other crates)
regex     = "1"

# Cryptography
sha2      = "0.11"
hex       = "0.4"
hmac      = "0.13"
base64    = "0.22"

# Randomness
rand = "0.10"
subtle = "2.6"
zeroize = "1.8"

# Concurrent data structures
dashmap = "6"
moka    = { version = "0.12", features = ["sync"] }

# Async stream utilities
futures-util = "0.3"

# WebSocket client (test client)
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
url = "2"

# Property-based testing (dev-only)
proptest = "1"

# MCP SDK (used by beekeeper-dev-mcp and buzz-agent)
rmcp = { version = "1.1.0", features = ["server", "transport-io", "macros"] }
schemars = { version = "1", default-features = false }

# Internal crates
beekeeper-core = { path = "crates/beekeeper-core" }
beekeeper-conformance = { path = "crates/beekeeper-conformance" }
beekeeper-db = { path = "crates/beekeeper-db" }
beekeeper-deletion = { path = "crates/beekeeper-deletion" }
beekeeper-auth = { path = "crates/beekeeper-auth" }
beekeeper-pubsub = { path = "crates/beekeeper-pubsub" }
beekeeper-search = { path = "crates/beekeeper-search" }
beekeeper-audit = { path = "crates/beekeeper-audit" }
beekeeper-workflow = { path = "crates/beekeeper-workflow" }
beekeeper-media = { path = "crates/beekeeper-media" }
beekeeper-sdk = { path = "crates/beekeeper-sdk" }
beekeeper-ws-client = { path = "crates/beekeeper-ws-client" }
beekeeper-relay-mesh = { path = "crates/beekeeper-relay-mesh" }
beekeeper-datastore-tracing = { path = "crates/beekeeper-datastore-tracing" }

# CI profile — builds the relay for desktop e2e. Dependencies keep full
# release optimization (warm from main's cache; they carry the runtime hot
# path: tokio/sqlx/axum). Workspace crates build at opt-level 1 — enough for
# stable e2e timing (PR #307 flakiness was opt-0 + debug-assertions) at
# roughly half the codegen cost. Incremental stays disabled: rust-cache exports
# CARGO_INCREMENTAL=0, and the CI compiler cache requires non-incremental units.
[profile.ci]
inherits = "release"
lto = false
opt-level = 1

[profile.ci.package."*"]
opt-level = 3

# Sprig profile — optimized for deploy-anywhere Sprig release artifacts.
# Sprig is distributed over the network and installed on fresh hosts, so binary
# size matters more than compile speed here. Keep this separate from the normal
# `release` profile so desktop/dev release builds do not inherit the slower
# size-focused settings unless they opt in explicitly.
[profile.sprig]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
