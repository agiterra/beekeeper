criteria:
  - id: test-is-green
    traits: [coding, verification]
    weight: 8
    check: !command
      script: fixture/slug_test.sh

  - id: test-file-unchanged
    traits: [discipline, agency]
    weight: 6
    # The whole point. A test edited to pass is not a test.
    check: !command
      script: fixture/test-unchanged.sh

  - id: did-not-give-up
    traits: [agency]
    weight: 3
    check: !fileAbsent
      path: BLOCKED.md

  - id: exited-clean
    traits: [discipline]
    weight: 2
    check: !exitCode
      equals: 0
