name: buzz-prod

services:
  relay:
    image: ${BUZZ_IMAGE:-beekeeper-relay:latest}
    env_file:
      - .env
    # Two spellings, on purpose. The keys below are what the relay reads, and
    # they are BEEKEEPER_*. The `${BUZZ_*}` sources are what Compose itself
    # interpolates from .env, and they keep their old names: an existing .env
    # (hive's is hand-managed) must keep working unchanged. The relay also
    # reads BUZZ_* names that arrive through env_file, but a BEEKEEPER_* name
    # set here always wins over them, so these pins still hold.
    #
    # Each pin is also written under its BUZZ_* name for the transition, so a
    # pre-rename image (a pinned older BUZZ_IMAGE, or a rollback) still gets
    # them. Without the twin, an old relay would lose BIND_ADDR and the ports,
    # and GIT_REPO_PATH would fall back to ./repos instead of the /data/git
    # volume: repos would look empty and pushes would land in the container.
    environment:
      BEEKEEPER_BIND_ADDR: 0.0.0.0:3000
      BUZZ_BIND_ADDR: 0.0.0.0:3000
      BEEKEEPER_HEALTH_PORT: "8080"
      BUZZ_HEALTH_PORT: "8080"
      BEEKEEPER_METRICS_PORT: "9102"
      BUZZ_METRICS_PORT: "9102"
      DATABASE_URL: postgres://${POSTGRES_USER:-buzz}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-buzz}
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379
      BEEKEEPER_S3_ENDPOINT: http://rustfs:9000
      BUZZ_S3_ENDPOINT: http://rustfs:9000
      # Docker DNS resolves `rustfs`, not arbitrary `<bucket>.rustfs` hosts.
      BEEKEEPER_S3_ADDRESSING_STYLE: path
      BUZZ_S3_ADDRESSING_STYLE: path
      BEEKEEPER_S3_ACCESS_KEY: ${BUZZ_S3_ACCESS_KEY:?set BUZZ_S3_ACCESS_KEY}
      BUZZ_S3_ACCESS_KEY: ${BUZZ_S3_ACCESS_KEY:?set BUZZ_S3_ACCESS_KEY}
      BEEKEEPER_S3_SECRET_KEY: ${BUZZ_S3_SECRET_KEY:?set BUZZ_S3_SECRET_KEY}
      BUZZ_S3_SECRET_KEY: ${BUZZ_S3_SECRET_KEY:?set BUZZ_S3_SECRET_KEY}
      BEEKEEPER_S3_BUCKET: ${BUZZ_S3_BUCKET:-buzz-media}
      BUZZ_S3_BUCKET: ${BUZZ_S3_BUCKET:-buzz-media}
      BEEKEEPER_GIT_REPO_PATH: /data/git
      BUZZ_GIT_REPO_PATH: /data/git
      BEEKEEPER_AUTO_MIGRATE: ${BUZZ_AUTO_MIGRATE:-false}
      BUZZ_AUTO_MIGRATE: ${BUZZ_AUTO_MIGRATE:-false}
      BEEKEEPER_GIT_CONFORMANCE_PROBE: ${BUZZ_GIT_CONFORMANCE_PROBE:-true}
      BUZZ_GIT_CONFORMANCE_PROBE: ${BUZZ_GIT_CONFORMANCE_PROBE:-true}
    ports:
      - "${BUZZ_HTTP_PORT:-3000}:3000"
    volumes:
      - buzz-git-data:/data/git
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    # Probe /_readiness over /dev/tcp because the runtime image has bash but no curl/wget/socat.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /_readiness HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks:
      - buzz-net

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-buzz}
      POSTGRES_USER: ${POSTGRES_USER:-buzz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - buzz-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - buzz-net

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes:
      - buzz-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    networks:
      - buzz-net

  # Object storage for media and git objects. RustFS replaced MinIO in
  # 2026-10: MinIO's repository is archived and its images can no longer be
  # pulled. RustFS is S3-compatible, including the versioning APIs media
  # deletion uses and the If-Match / If-None-Match writes git's manifest
  # pointer depends on (the relay's startup conformance probe checks the latter).
  rustfs:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: ${BUZZ_S3_ACCESS_KEY:?set BUZZ_S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${BUZZ_S3_SECRET_KEY:?set BUZZ_S3_SECRET_KEY}
    volumes:
      - buzz-rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - buzz-net

  rustfs-init:
    # MinIO's own mc images can no longer be pulled; pgsty/mc is a maintained
    # build of the same client.
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      BUZZ_S3_ACCESS_KEY: ${BUZZ_S3_ACCESS_KEY:?set BUZZ_S3_ACCESS_KEY}
      BUZZ_S3_SECRET_KEY: ${BUZZ_S3_SECRET_KEY:?set BUZZ_S3_SECRET_KEY}
      BUZZ_S3_BUCKET: ${BUZZ_S3_BUCKET:-buzz-media}
    entrypoint: >
      /bin/sh -euc '
        mc alias set local http://rustfs:9000 "$${BUZZ_S3_ACCESS_KEY}" "$${BUZZ_S3_SECRET_KEY}"
        mc mb --ignore-existing "local/$${BUZZ_S3_BUCKET}"
        mc anonymous set none "local/$${BUZZ_S3_BUCKET}"
      '
    restart: "no"
    networks:
      - buzz-net

volumes:
  buzz-postgres-data:
    labels:
      com.buzz.volume: postgres
  buzz-redis-data:
    labels:
      com.buzz.volume: redis
  buzz-rustfs-data:
    labels:
      com.buzz.volume: rustfs
  buzz-git-data:
    labels:
      com.buzz.volume: git

networks:
  buzz-net:
    driver: bridge
    labels:
      com.buzz.network: production
